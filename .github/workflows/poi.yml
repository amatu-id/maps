name: Data SPBU OSM
# Builds data/poi/ (SPBU, rest area, SPKLU se-Indonesia) from the daily Geofabrik extract of OpenStreetMap.
# Runs every Monday 03:17 WIB, or by hand (Actions → Data SPBU OSM → Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 0'
permissions:
  contents: write
concurrency:
  group: poi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Unduh ekstrak Indonesia (Geofabrik)
        run: curl -sSfL --retry 4 --retry-delay 20 -o id.osm.pbf https://download.geofabrik.de/asia/indonesia-latest.osm.pbf && ls -la id.osm.pbf
      - name: Saring SPBU / rest area / SPKLU
        run: |
          osmium tags-filter id.osm.pbf nwr/amenity=fuel nwr/amenity=charging_station nwr/highway=services nwr/highway=rest_area -o poi.osm.pbf --overwrite
          osmium export poi.osm.pbf -f geojsonseq -a type,id -o poi.geojsonseq --overwrite
          ls -la poi.osm.pbf poi.geojsonseq
      - name: Bangun data/poi
        run: python3 tools/build_poi.py poi.geojsonseq data/poi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poi
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else git commit -q -m "Data SPBU OSM $(date -u +%F)" && git push; fi
